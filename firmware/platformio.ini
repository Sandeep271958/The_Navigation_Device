; NavigateMe Firmware PlatformIO Configuration
; Primary Target: Electrobot ESP32-D35 (ESP32-3248S035, 3.5" ST7796 480x320)

[platformio]
default_envs = esp32_d35_st7796
src_dir = src
include_dir = include

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    lovyan03/LovyanGFX @ ^1.1.16
    h2zero/NimBLE-Arduino @ ^1.4.2
    bblanchon/ArduinoJson @ ^7.0.4

build_flags = 
    -D CORE_DEBUG_LEVEL=3

; ====================================================================
; Primary Target: Electrobot ESP32-D35 (3.5" ST7796 480x320)
; Product Link: https://store.electrobot.co.in/product/esp32d35
; ====================================================================
[env:esp32_d35_st7796]
platform = espressif32 @ ~6.5.0
board = esp32dev
build_flags = 
    ${env.build_flags}
    -D TARGET_ESP32_D35=1
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=320
    -D TFT_ROTATION=1

; ====================================================================
; Fallback Environment: ESP32-2432S028 (CYD 2.8" 320x240)
; ====================================================================
[env:esp32_2432s028_cyd]
platform = espressif32 @ ~6.5.0
board = esp32dev
build_flags = 
    ${env.build_flags}
    -D TARGET_CYD_28=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=240
    -D TFT_ROTATION=1
